<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Klickers screen</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@1,500&family=Space+Grotesk:wght@600;700&family=Syne:wght@800&display=block" rel="stylesheet">
<style>html,body{margin:0;overflow:hidden}.dev-scr{border-radius:0!important}</style>
</head>
<body>
<div id="root" class="dev"><div class="dev-scr" id="scr"></div></div>
<script src="photos.js"></script>
<script src="kit.js"></script>
<script>
const s = new URLSearchParams(location.search).get('s') || 'plans';
document.getElementById('scr').innerHTML = window.SCREENS[s]();
document.fonts.ready.then(() => setTimeout(() => (window.READY = true), 300));
</script>
</body>
</html>
