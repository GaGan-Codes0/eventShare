# Production stack on the EC2 server. Started from the git checkout by scripts/server-deploy.sh.
# Secrets live in /opt/eventshare/.env and .env.db, created on the server at first boot; they never leave it.
name: eventshare

services:
  postgres:
    # Postgres 16 with pgvector, for matching faces inside the database. Trixie: same system libraries as
    # postgres:16, so text indexes stay valid when switching images.
    image: pgvector/pgvector:pg16-trixie
    restart: unless-stopped
    env_file: /opt/eventshare/.env.db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventshare']
      interval: 5s
      retries: 10

  # Cache, background jobs and live updates. Private to this Docker network (no published port).
  # noeviction: queued jobs must never be dropped (every cache entry has its own expiry).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: eventshare-api:current
    restart: unless-stopped
    env_file: /opt/eventshare/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # HTTPS in front of the API: fetches and renews a free Let's Encrypt certificate.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      API_HOST: ${API_HOST:?set by server-deploy.sh}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
