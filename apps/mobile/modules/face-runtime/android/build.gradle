plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'co.klyra.eventshare'
version = '1.0.0'

expoModule {
  v2 true
}

android {
  namespace "co.klyra.eventshare.faceruntime"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    // Keeps ONNX Runtime's classes intact in shrunk (release) builds.
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
}
